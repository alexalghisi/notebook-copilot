scalar JSON

enum CellType {
    sql
    markdown
}

enum RunStatus {
    running
    succeeded
    failed
}

type Notebook {
    id: ID!
    title: String!
    createdAt: String!
    "Cells as they are right now in the live document."
    cells: [Cell!]!
    runs(limit: Int = 20): [Run!]!
}

type Cell {
    id: ID!
    type: CellType!
    source: String!
    output: OutputSummary
}

type OutputSummary {
    runId: ID!
    status: RunStatus!
    rowCount: Int
    error: String
    durationMs: Int
}

type Column {
    name: String!
    type: String!
}

type Run {
    id: ID!
    notebookId: ID!
    cellId: ID!
    source: String!
    status: RunStatus!
    columns: [Column!]!
    "Rows as arrays of values in column order. Numerics are strings to keep their precision."
    rows: [[JSON]!]!
    rowCount: Int
    truncated: Boolean!
    error: String
    "1-based character offset of the error in the source, when Postgres reports one."
    errorPosition: Int
    durationMs: Int
    startedAt: String!
    finishedAt: String
}

type TableColumn {
    name: String!
    type: String!
    nullable: Boolean!
    comment: String
}

type Table {
    name: String!
    comment: String
    rowEstimate: Int!
    columns: [TableColumn!]!
}

type Query {
    notebooks: [Notebook!]!
    notebook(id: ID!): Notebook
    run(id: ID!): Run
    "Tables SQL cells can query."
    sampleSchema: [Table!]!
}

type Mutation {
    "Creates a notebook, optionally from the sample analysis template."
    createNotebook(title: String!, fromTemplate: Boolean = false): Notebook!
    "Runs a SQL cell's current source. Collaborators see the result through the document."
    runCell(notebookId: ID!, cellId: ID!): Run!
}

enum CopilotAction {
    "Answer a question about the notebook."
    ask
    "Write or fix the given cell; ends with a proposed edit."
    edit
}

input CopilotInput {
    notebookId: ID!
    action: CopilotAction!
    prompt: String!
    "The cell to edit, or the cell the question is about."
    cellId: ID
}

enum CopilotEventKind {
    started
    context
    step
    text
    tool_call
    tool_result
    proposal
    usage
    done
}

type ContextItem {
    kind: String!
    id: String!
    tokens: Int!
    status: String!
    reason: String!
}

type Usage {
    promptTokens: Int!
    completionTokens: Int!
    costUsd: Float!
    "True when the model server didn't report usage and tokens were counted locally."
    estimated: Boolean!
}

type DiffLine {
    kind: String!
    text: String!
}

type Proposal {
    cellId: ID!
    base: String!
    proposed: String!
    explanation: String!
    diff: [DiffLine!]!
}

"One streamed step of a copilot request. Which fields are set depends on `kind`."
type CopilotEvent {
    kind: CopilotEventKind!
    requestId: ID!
    model: String
    step: Int
    text: String
    toolName: String
    toolArguments: String
    toolSummary: String
    isError: Boolean
    contextTokens: Int
    contextBudget: Int
    contextItems: [ContextItem!]
    proposal: Proposal
    usage: Usage
    stopReason: String
    answer: String
    error: String
    latencyMs: Int
    firstTokenMs: Int
}

type CopilotRequest {
    id: ID!
    action: CopilotAction!
    cellId: ID
    prompt: String!
    model: String!
    status: String!
    stopReason: String
    answer: String
    proposal: Proposal
    contextTokens: Int
    promptTokens: Int
    completionTokens: Int
    costUsd: Float
    steps: Int
    latencyMs: Int
    createdAt: String!
}

extend type Query {
    copilotRequests(notebookId: ID!, limit: Int = 20): [CopilotRequest!]!
    "The model copilot requests use: `offline` unless an API key is configured."
    copilotModel: String!
}

type Subscription {
    "Runs a copilot request and streams its progress. Served over SSE (or any GraphQL subscription transport)."
    copilot(input: CopilotInput!): CopilotEvent!
}
